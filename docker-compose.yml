version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: inspire-oman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: inspire_oman
    ports:
      - "5432:5432"
    volumes:
      - inspire_oman_pg:/var/lib/postgresql/data

volumes:
  inspire_oman_pg:
