aboutEyebrow: About the Initiative
aboutTitle: Celebrating Oman's Growth Story
aboutBody: >-
  In strategic partnership with the Oman Chamber of Commerce & Industry (OCCI),
  Inspire Oman brings together CEOs, investors, government leaders, and entrepreneurs
  to celebrate contributions, strengthen investment pathways, and document the
  remarkable achievements of Oman's business community.
aboutTags:
  - Oman Vision 2040
  - OCCI Partnership
  - Cross-Border Investment
ctaTitle: Be Part of Oman's Growth Story
ctaBody: >-
  Join Inspire Oman as a partner or delegate and connect with the region's
  most dynamic business community
